name: CICD

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: khemchandmehra/multi-agent-backend

jobs:
  build-push-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Stop and remove old container
        run: |
          docker stop multi-agent-backend || true
          docker rm multi-agent-backend || true

      - name: Run new container
        run: |
          docker run -d \
            --name multi-agent-backend \
            --restart unless-stopped \
            -p 8080:8080 \
            --env-file /home/ubuntu/multi-agent-backend.env \
            ${{ env.IMAGE_NAME }}:latest

      - name: Clean up old images
        run: docker image prune -f
